dashgo_driver:
  ros__parameters:
    port: /dev/ttyUSB1
    baud: 115200
    timeout: 0.1
    rate: 50
    sensorstate_rate: 10
    cmd_vel_topic: cmd_vel
    odom_topic: odom
    odom_frame: odom
    publish_odom_tf: true

    useSonar: false
    useImu: true
    imu_command: angle
    imu_angle_topic: imu_angle
    imu_raw_topic: imu_angles_raw
    imu_topic: imu/data
    imu_frame: imu_link
    imu_yaw_covariance: 0.05
    imu_yaw_scale: 1.0
    use_imu_heading_in_odom: false
    use_base_controller: true
    base_controller_rate: 10.0
    base_controller_timeout: 1.0

    base_frame: base_footprint

    sonar_height: 0.115
    sonar0_offset_yaw: 0.524
    sonar0_offset_x: 0.18
    sonar0_offset_y: 0.10
    sonar1_offset_yaw: 0.0
    sonar1_offset_x: 0.20
    sonar1_offset_y: 0.0
    sonar2_offset_yaw: -0.524
    sonar2_offset_x: 0.18
    sonar2_offset_y: -0.10
    sonar3_offset_yaw: 3.14
    sonar3_offset_x: -0.20
    sonar3_offset_y: 0.0

    wheel_diameter: 0.1280
    wheel_track: 0.341
    encoder_resolution: 1200
    gear_reduction: 1.0
    motors_reversed: false

    Kp: 50
    Kd: 20
    Ki: 0
    Ko: 50
    accel_limit: 1.0

    encoder_min: -32768
    encoder_max: 32768
