<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#113355">
    <title>Dashgo 手机控制台</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <h1>Dashgo 遥控台</h1>
          <p id="status-line">正在连接机器人...</p>
        </div>
        <div class="header-actions">
          <div class="status-strip">
            <div class="status-chip mode-chip">
              <span class="status-dot mode-dot" id="mode-dot"></span>
              <span id="mode-text">模式 --</span>
            </div>
            <div class="status-chip">
              <span class="status-dot" id="radar-dot"></span>
              <span>雷达</span>
            </div>
            <div class="status-chip">
              <span class="status-dot" id="base-dot"></span>
              <span>底盘</span>
            </div>
            <div class="status-chip">
              <span class="status-dot" id="camera-dot"></span>
              <span>相机</span>
            </div>
          </div>
          <button id="stop-button" class="stop-button">急停</button>
        </div>
      </header>

      <main class="content">
        <section class="panel map-panel">
          <div class="panel-title compact-title">
            <span>地图与导航</span>
            <button id="refresh-map-button" class="ghost-button">刷新地图</button>
          </div>
          <canvas id="map-canvas" width="900" height="900"></canvas>
          <p class="hint">
            地图操作：点按并拖动设置目标朝向，松开后发送导航目标。
          </p>
        </section>

        <section class="panel side-panel">
          <div class="panel-title compact-title">
            <span>实时控制</span>
          </div>

          <div class="mode-switch">
            <button id="manual-mode-button" class="mode-button">手动模式</button>
            <button id="nav-mode-button" class="mode-button active">导航模式</button>
          </div>

          <div class="camera-card">
            <div class="camera-title">
              <span>前视画面</span>
              <span id="camera-status" class="camera-status">等待相机</span>
            </div>
            <img id="camera-frame" class="camera-frame" alt="D435 camera stream">
          </div>

          <div class="remote-layout">
            <div class="joystick-card">
              <div id="joystick-base" class="joystick-base">
                <div id="joystick-knob" class="joystick-knob"></div>
              </div>
              <p class="hint">按住摇杆拖动控制底盘，松手自动停车。</p>
            </div>

            <div class="stats-grid">
              <div class="stat-card">
                <label>机器人位置</label>
                <strong id="pose-text">--</strong>
              </div>
              <div class="stat-card">
                <label>速度</label>
                <strong id="velocity-text">--</strong>
              </div>
              <div class="stat-card">
                <label>地图状态</label>
                <strong id="map-text">--</strong>
              </div>
              <div class="stat-card">
                <label>导航目标</label>
                <strong id="goal-text">--</strong>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
